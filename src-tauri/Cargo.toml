[package]
name = "aerocheetah-dbm"
version = "0.1.0"
description = "High-performance, lightweight database manager built with Tauri and Rust"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aerocheetah_dbm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
mongodb = { version = "3.1", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-3-0"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
azure_identity = "0.21"
azure_core = "0.21"

